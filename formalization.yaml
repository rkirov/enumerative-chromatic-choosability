# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
#
# Registry metadata for this development, in the mathlib-initiative formalization.yaml v0.4
# format and nothing else: every key below is a v0.4 field. The statement-by-statement map from
# the Kirov-Naimi paper (and from the other sources) to the Lean declarations is the free-form
# `alignment` block, in the shape the v0.4 template suggests. Prose lives in provenance.md
# (credit), plan.md (what mechanization turned up) and references.md (bibliography); the
# toolchain and Mathlib pin are in lean-toolchain and lake-manifest.json, not repeated here.
#
# Every Lean name below resolves against the built library. For a registry submission the three
# repository-relative paths are: selected project `comparator`, comparator config
# `comparator/config.json`, metadata `formalization.yaml`; `python3 check-submission.py` checks
# the mechanical requirements that go with them.

version: v0.4

project:
  name: "List coloring and enumeratively chromatic-choosable graphs"
  description: >-
    A machine-checked development of list colouring in Lean 4. Give each vertex of a finite
    graph its own list of n permitted colours and count the proper colourings that respect
    those lists; the graph is enumeratively chromatic-choosable (ECC) at n when that count is
    minimized by giving every vertex the same list. Kostochka and Sidorenko raised the
    question in 1990.

    The development formalizes Kirov and Naimi, "List coloring and n-monophilic graphs"
    (Ars Combinatoria 124 (2016), 329-340; arXiv:1004.5183), in the generality the paper
    states: every cycle is ECC at every n (their Theorem 1); the exact characterization of the
    graphs ECC at 2 (their Theorem 2), unconditionally, because the Rubin theorem that paper
    quotes is proved here rather than assumed; and for every list size k at least 2 a graph
    that is k-choosable but not ECC at k. It also proves the results the paper relies on: the
    chromatic polynomial and its evaluation as a colouring count, the Kostochka-Sidorenko
    corollary for chordal graphs, the Erdos-Rubin-Taylor separation, and Donner's theorem that
    every graph is ECC at all sufficiently large n. It formalizes Zhang and Dong's 2026
    non-persistence theorem, which answers the paper's Question 2 negatively. As far as we can
    determine, list colouring and choosability had not previously been formalized in any proof
    assistant, and Rubin's 1980 characterization of the 2-choosable graphs is proved here in
    both directions.

    Beyond the paper, the development proves results that, as far as a targeted literature
    search found, are not in the literature. (1) The complete ECC spectrum of cacti: a cactus is
    ECC at every list size if and only if it has at most one cycle or contains an odd cycle; the
    block induction carries a pair bound above list size 3 and geometric-mean dominance at 3,
    where the even-cycle blocks need a tensor capacity argument. (2) The height-two and
    height-three cases of Kirov-Naimi's Question 1 for paths: every 2 x (n+1) and every
    3 x (n+1) grid is ECC at every list size k >= 3, with the uniform counts in closed form. The
    ladder proof is a transfer-matrix invariant; the height-three proof is a telescoping
    identity with pair lemmas for k >= 5, two-column lookback with LP certificates at k = 4, and
    at k = 3 an entropy (Parry-Renyi) argument whose seam couplings are 22,157 kernel-checked
    records. (3) Maximum-degree thresholds for the list colour function: every finite graph is
    ECC at every k >= ceil(5.67 Delta); maximum degree at most 3 suffices at k >= 15 and at most
    4 at k >= 20, so every rectangular grid is ECC at every k >= 20; at these thresholds two
    adjacent vertices with different lists force strictly more colourings, so on a connected
    graph only constant assignments attain equality. This adapts Zhang and Dong's 2026
    interpolation method (their threshold is 23.41 Delta), and its limiting constant coincides
    with Dong and Koh's 2008 bound on real chromatic roots, to whom the positivity half is
    credited. (4) K_{2,n} at list sizes 3, 4, 5: it is ECC exactly for n <= 11, 25, 43. Kaul et
    al. (2023, Theorem 7) prove all but K_{2,11} at 3 and K_{2,25}, K_{2,26} at 4, which they state
    are unknown; K_{2,11} and K_{2,25} are ECC and K_{2,26} is not, the last refuting a uniform
    statement for 2-degenerate graphs. The positive side is a reduction to one numeric inequality
    per overlap of the hub lists, closed by kernel-checked AM-GM branch-and-bound certificates; the
    negative side is their Lemma 11 family with an induction on n/4. (5) tau(K_{2,n}) = O(sqrt n):
    K_{2,n} is ECC at every k >= 300 with n <= k^2. With Theorem 4 of Kaul-Kumar-Mudrock-Rewers-
    Shin-To (arXiv:2202.03431) this proves their Conjecture 5, tau(K_{2,n}) = Theta(sqrt n), which
    both that paper and arXiv:2207.04831 state as open; the previous upper bound was linear. The
    proof is AM-GM within four classes of hub-colour pairs and a four-regime real inequality closed
    by tangent-line bounds of the exponential.

    The only sorry in the repository is in OpenProblems.lean, a separate library imported by
    nothing, which states Kirov-Naimi's still-open Question 1 and one known but unformalized
    remark. Every claimed result depends on exactly propext, Classical.choice and Quot.sound.
  authors: ["Radoslav Kirov"]
  responsible_maintainers: ["Radoslav Kirov"]
  license: Apache-2.0

classification:
  arxiv: [math.CO, cs.LO]
  msc2020:
    - "05C15"   # coloring of graphs and hypergraphs
    - "05C31"   # graph polynomials
    - "05C38"   # paths and cycles
    - "68V20"   # formalization of mathematics in connection with theorem provers

# Source-based: the paper and the literature below are formalized or adapted. The results
# original to this repository (cacti, ladders, height-three grids, the maximum-degree
# thresholds, K_{2,26}) are described in `project.description` and mapped in `alignment`;
# Palomar's rules do not allow an `original-proof` entry next to substantive sources.
sources:
  - title: "List coloring and n-monophilic graphs"
    authors: ["Radoslav Kirov", "Ramin Naimi"]
    type: paper
    id: "arXiv:1004.5183"
    location: "Ars Combinatoria 124 (2016), 329-340; formalized against arXiv:1004.5183v1, 29 Apr 2010"
    relationship: formalizes
    license: "not stated by the publisher"
    author_endorsement: participated
    note: >-
      The source paper. Its Lemmas 1-10, Theorems 1 and 2 and the Section 5 construction are
      formalized; see `alignment`. The paper's "n-monophilic" is the later literature's
      "enumeratively chromatic-choosable" (SimpleGraph.ECCAt), the name used throughout. One
      mathematical error was found, a range condition on three lemmas of Section 5 that does not
      affect that section's theorem; see `fidelity`. The first author of the paper is the author
      of this formalization.
  - title: "Choosability in graphs"
    authors: ["Paul Erdos", "Arthur L. Rubin", "Herbert Taylor"]
    type: paper
    id: "Congressus Numerantium 26 (1980), 125-157"
    location: "Rubin's characterization of the 2-choosable graphs, pp. 131-134; the K_{n,n^n} separation"
    relationship: formalizes
    note: >-
      Quoted by the source paper and proved here rather than assumed, which is what makes the
      formalized Theorem 2 unconditional. Rubin's theorem appears not to have been formalized
      before. The bibliographic record is corrected in references.md: the year is 1980, not
      1979, and the pagination is 125-157, not 125-127.
  - title: "On the number of list-colorings"
    authors: ["Q. Donner"]
    type: paper
    id: "Journal of Graph Theory 16 (3) (1992), 239-245"
    location: "every graph is enumeratively chromatic-choosable at all sufficiently large list sizes"
    relationship: formalizes
    note: >-
      Proved here with the explicit threshold n > 2^|E(G)|, a weaker bound than the polynomial
      one of Wang-Qian-Yan 2017 and much weaker than Dong-Zhang 2023, neither of which is
      formalized as stated.
  - title: "Problem presented at the problem session, Fourth Czechoslovak Symposium on Combinatorics, Prachatice 1990"
    authors: ["Alexandr V. Kostochka", "Alexander F. Sidorenko"]
    type: paper
    id: "Annals of Discrete Mathematics 51 (1992), 380"
    relationship: background
    note: >-
      The origin of the question. It is a one-page problem-session abstract, not a paper; the
      chordal-graph corollary attributed to it is proved here as SimpleGraph.ecc_of_isChordal.
  - title: "Non-persistence of equality between chromatic polynomials and list-color functions"
    authors: ["Meiqiao Zhang", "Fengming Dong"]
    type: paper
    id: "arXiv:2608.19773"
    location: "Theorem 6"
    relationship: formalizes
    note: >-
      For every k >= 3, infinitely many k-colourable graphs that are ECC at k and not at k+1.
      Formalized in NonPersistence/; it refutes Kirov-Naimi Section 6, Question 2. The
      mathematics is Zhang and Dong's.
  - title: "Bounding the list color function threshold from above"
    authors: ["Hemanshu Kaul", "Akash Kumar", "Andrew Liu", "Jeffrey A. Mudrock", "Patrick Rewers", "Paul Shin", "Michael Scott Tanahara", "Khue To"]
    type: paper
    id: "doi:10.2140/involve.2023.16.849"
    location: "Involve 16 (5) (2023), 849-882 (arXiv:2207.04831v2), Theorem 7; Lemmas 5 and 11"
    relationship: formalizes
    note: >-
      Theorem 7 (K_{2,n} is ECC at 3 for 2 <= n <= 10 and not for n >= 12; at 4 for n <= 24 and
      not for n >= 27; at 5 exactly for n <= 43) is proved here, by a different method: exact
      kernel-checked AM-GM certificates in place of their floating-point checks of AM-GM bounds, and
      an induction on n/4 for their Lemma 11 family in place of their appeal to Theorem 14 of
      arXiv:2202.03431. Their Lemma 5 is exists_push. The three cases they state are unknown are
      settled: K_{2,11} is ECC at 3, K_{2,25} is ECC at 4, and K_{2,26} is not (the last is their
      Lemma 11 family at n = 26). Their Lemma 6 (hub lists sharing k - 1 colours) is reproved as
      SimpleGraph.TwoDegenerate.K2nSqrt.lemma6 and used for tau(K_{2,n}) = O(sqrt n).
  - title: "On the list color function threshold"
    authors: ["Hemanshu Kaul", "Akash Kumar", "Jeffrey A. Mudrock", "Patrick Rewers", "Paul Shin", "Khue To"]
    type: paper
    id: "arXiv:2202.03431"
    location: "arXiv:2202.03431v2, Theorem 4 and Conjecture 5"
    relationship: other
    note: >-
      Their Theorem 4 (tau(K_{2,l}) - chi_l(K_{2,l}) >= C sqrt l) is not formalized. Their
      Conjecture 5, tau(K_{2,l}) = Theta(sqrt l), is proved here on the upper side:
      SimpleGraph.TwoDegenerate.K2nSqrt.completeBipartite_two_eccAt_of_sq_le (ECC at every
      k >= 300 with n <= k^2). The argument is original to this repository.
  - title: "When chromatic polynomials coincide with list-color functions: a threshold linear in the maximum degree"
    authors: ["Meiqiao Zhang", "Fengming Dong"]
    type: paper
    id: "arXiv:2609.08540"
    location: "Theorem 5; Sections 2-3"
    relationship: adapts
    note: >-
      The method of GridGen/'s maximum-degree theorems: the connected-set interpolation between
      P(G,k) and P(G,L) and the tree-wise charging of list deficiencies. They prove equality
      for k >= 23.41 Delta with a quantitative strictness estimate; GridGen/ reaches
      ceil(5.67 Delta) by charging only adverse coefficient parities and keeping the
      edge-deletion partition functions.
  - title: "Bounds for the real zeros of chromatic polynomials"
    authors: ["F. M. Dong", "K. M. Koh"]
    type: paper
    id: "Combinatorics, Probability and Computing 17 (6) (2008)"
    relationship: other
    note: >-
      Real chromatic roots lie below 5.664 Delta, and below 4.765 Delta when Delta = 3. These
      are exactly the limiting constants of GridGen/'s certificate (5.6634 Delta; 15 at
      Delta = 3), so the positivity half of that argument is credited to them. Their proof has
      not been compared line by line with this one.
  - title: "When does the list-coloring function of a graph equal its chromatic polynomial"
    authors: ["Wei Wang", "Jianguo Qian", "Zhidan Yan"]
    type: paper
    id: "doi:10.1016/j.jctb.2016.08.002"
    location: "Journal of Combinatorial Theory, Series B 122 (2017), 543-549; the deficiency inequality along a tree"
    relationship: adapts
    note: >-
      The inequality d(S) <= sum of the edge deficiencies along any spanning tree of S,
      attributed to them as Lemma 10 of arXiv:2609.08540, is proved here
      (GridGen/PolymerDeficiency.lean) and drives the derivative charging.
  - title: "Bounds on the complex zeros of (di)chromatic polynomials and Potts-model partition functions"
    authors: ["Alan D. Sokal"]
    type: paper
    id: "arXiv:cond-mat/9904146"
    location: "Combinatorics, Probability and Computing 10 (2001), 41-77"
    relationship: background
    note: "The connected-block (polymer) expansion and the tree-graph bound, both standard; proved here from scratch."

related_formalizations: []

automation:
  methods:
    - method: agent
      models: ["claude-opus-5", "claude-fable-5", "claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        Agent sessions directed by the repository owner, with subagents used for parallel
        search, for independent proof attempts on a stated lemma, and for adversarial review
        of claimed proofs. Every landed proof was compiled by Lake before being committed; no
        proof was accepted on an agent's report alone.
      prompting_notes: >-
        The mathematics of the results beyond the paper (cacti, ladders, height-three grids)
        was developed in the same sessions and is recorded in ai_research_notes/. Formalizing
        those notes corrected several of their claims, including a reported gap that was an
        argument for longer cycles misapplied to a short one.
    - method: agent
      framework: "OpenAI Codex CLI"
      tool_setup: >-
        A Codex session working in the same repository in September 2026, concurrently with
        Claude Code; it proved the strictness and equality statements of
        GridGen/PolymerStability.lean at the uniform maximum-degree threshold and wrote
        GridGen/parity_budget_review.py.
    - method: manual
      tool_setup: >-
        Statement design, the choice of what to claim in comparator/Challenge.lean, the
        bibliographic verification in references.md, and the credit assignment in
        provenance.md.

review:
  status: agent-reviewed
  reviewers: ["Claude (adversarial review agents, Claude Code)"]
  notes: >-
    Each landed proof was re-checked by an agent instructed to refute it, working from a fresh
    copy and required to reproduce the compile, to run #print axioms on every declaration, and
    to confirm that the statement proved is the statement claimed. Statements were also checked
    by brute-force evaluation before being proved, which repeatedly caught indexing and
    orientation errors that do not surface as type errors; those checks are #guard commands in
    the library and in Checks/. In addition, leanprover/comparator runs in CI against
    comparator/Challenge.lean, checking statement identity, the permitted axioms, and replay of
    the exported proofs through Lean's kernel (the independent NanoDa kernel is not run: a
    second sequential replay of the k = 3 certificate does not fit CI's time limit). No
    independent human review has been performed.

status:
  scope: >-
    ListColoring/ formalizes the source paper and the results it quotes. NonPersistence/
    formalizes Zhang-Dong's non-persistence theorem. Cacti/, Ladder/, Grid3/ (with the k = 3
    case in Grid3/Three/Main.lean, outside the Grid3 entry point because it rests on the
    kernel-checked seam records of Grid3/Three/Cert/Data/), GridGen/ and TwoDegenerate/ prove
    the results beyond the paper; each imports ListColoring/, never the reverse. GridGen/ also
    contains a conditional reduction for grids of every height whose open hypotheses are stated
    as Props, not assumed. There is no sorry, admit or native_decide in any of these libraries,
    which CI checks. OpenProblems.lean is a separate library, imported by nothing, that states
    Kirov-Naimi's Question 1 (open) and the known but unformalized negative remark under it,
    both asserted with sorry, and proves Question 2 false from NonPersistence/. Those two are
    the only sorries in the repository. Not formalized: the Dong-Zhang 2023 threshold
    |E(G)| - 1, the Chi et al. 2026 theta-graph classification, and the rectangular grids at
    list sizes 3 to 19 with both sides at least 4.
