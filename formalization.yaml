fidelity:
  divergences: >-
    Deviations from the source paper, each noted on its `alignment` entry. (1) Section 5's
    Lemmas 7, 9 and 10 are stated "for all n >= 1" but are false at n = 1 and are proved for
    n >= 2: at n = 1 no admissible p exists (p is the least integer with n^p > x^{n^2}, which
    reads 1 > 2), for any p the graph H_2 contains a triangle, so col(H_2,2) = 0 < 2 =
    col(H_2,L) reverses Lemma 7 and H_2 is not 2-choosable, contradicting Lemma 10; and Lemma 9
    fails separately on K_{1,1} with both lists {0,1}. The #guard witnesses are at the foot of
    ListColoring/Section5.lean. Section 5's theorem is unaffected: at list size 2 the witness is
    theta_{2,2,4}, 2-choosable by Rubin and not ECC at 2 by the paper's own Figure 2. This is
    the only mathematical error found in the paper. (2) Lemma 8 is proved only in the two
    consequences Lemma 9 uses (the lists on the n-side are pairwise disjoint and of size n); the
    colour bijection and automorphism in "equivalent to L_0" are not needed downstream.
    (3) Theorem 1 is stated both on Mathlib's cycleGraph and on the development's own
    closePath. (4) A dangling cross-reference: the remark under Question 1 cites "Theorem 3",
    which does not exist; the intended reference is the Kostochka-Sidorenko corollary of
    Section 2 (paths are chordal). Donner's theorem is proved with the weaker explicit threshold
    2^|E(G)|. The results beyond the paper have no source to diverge from, except that the
    maximum-degree theorems prove a smaller threshold than the Zhang-Dong theorem they adapt.

alignment:
  statements:
    # ------------------------------------------------ Kirov-Naimi 2016, Section 1
    - source: "Kirov-Naimi 2016, Section 1, observation (2)"
      lean: SimpleGraph.ecc_of_not_colorable
      module: ListColoring/Basic.lean
      status: proved
      note: "If n < chi(G) then G is n-monophilic. Immediate from the definitions."
    - source: "Kirov-Naimi 2016, Section 1, observation (3)"
      lean: SimpleGraph.not_ecc_of_colorable_of_not_choosable
      module: ListColoring/Basic.lean
      status: proved
      note: "If chi(G) <= n < chi_l(G) then G is not n-monophilic."
    # ------------------------------------------------ Section 2
    - source: "Kirov-Naimi 2016, Lemma 1"
      lean: SimpleGraph.ECCAt.coneOn
      module: ListColoring/Cone.lean
      status: proved
      note: "Adding a vertex joined to a clique of an n-monophilic graph leaves it n-monophilic."
    - source: "Kostochka-Sidorenko 1990/92, the Section 2 corollary; = Theorem 2(i) of Chi et al. 2026"
      lean: SimpleGraph.ecc_of_isChordal
      module: ListColoring/Dirac.lean
      status: proved
      note: >-
        Every chordal graph is n-monophilic for every n. Also SimpleGraph.IsChordal.ecc and
        SimpleGraph.ecc_cliqueTower, the simplicial-elimination form the paper actually needs, so
        Dirac's theorem is not on the critical path.
    - source: "Dirac 1961; Fulkerson-Gross 1965 (cited in Section 2)"
      lean: SimpleGraph.isChordal_iff_exists_cliqueTower
      module: ListColoring/Dirac.lean
      status: proved
      note: "A graph is chordal iff it has a simplicial elimination ordering. Not needed by any Kirov-Naimi result."
    # ------------------------------------------------ Section 3
    - source: "Kirov-Naimi 2016, Lemma 2"
      lean: SimpleGraph.exists_nested_of_bridge
      module: ListColoring/Bridge.lean
      status: proved
      note: "A list swap across a bridge produces nested endpoint lists without increasing col."
    - source: "Kirov-Naimi 2016, Lemma 3(a)"
      lean: ListColoring.col_pathAssign
      module: ListColoring/PathCount.lean
      status: proved
      note: "A_k - B_k = (-1)^k and the closed form of A_k. ListColoring.col_of_isPathShape is the same count off the canonical assignment."
    - source: "Kirov-Naimi 2016, Lemma 3(b)"
      lean: ListColoring.min_pathA_pathB_le_col
      module: ListColoring/PathMinimizing.lean
      status: proved
      note: "col(P,L) >= min(A_k, B_k)."
    - source: "Kirov-Naimi 2016, Lemma 3(c)"
      lean: ListColoring.isPathShape_parity_of_minimizing
      module: ListColoring/PathMinimizing.lean
      status: proved
      note: >-
        For n >= 3 a minimizing assignment is type A with k odd or type B with k even (also
        ListColoring.exists_isPathShape_of_minimizing). The paper's "path of length at least one"
        is load-bearing: ListColoring.not_parity_of_minimizing_length_zero is a machine-checked
        counterexample at k = 0, which confirms the paper.
    - source: "Kirov-Naimi 2016, remark after Lemma 3"
      lean: ""
      module: ""
      status: not-formalized
      note: "For n = 2 a minimizing assignment need not be type A or B; asserted without proof in the paper."
    - source: "Kirov-Naimi 2016, Lemma 4"
      lean: ListColoring.col_lt_col_of_ssubset
      module: ListColoring/PathColorable.lean
      status: proved
      note: "Enlarging the lists on a path strictly increases col, when all lists have at least 2 colours."
    - source: "Kirov-Naimi 2016, Theorem 1; = Theorem 2(ii) of Chi et al. 2026"
      lean: ListColoring.ecc_closePath_of_two_le
      module: ListColoring/CycleRotate.lean
      status: proved
      note: >-
        Every cycle is n-monophilic for all n >= 2. Also ListColoring.ecc_closePath_all,
        ListColoring.closePath_ecc, ListColoring.ecc_closePath_two, and
        SimpleGraph.ecc_cycleGraph_of_three_le on Mathlib's cycleGraph.
    - source: "Kirov-Naimi 2016, note after Theorem 1"
      lean: ""
      module: ListColoring/CycleTwo.lean
      status: proved
      note: "The non-constant minimizing 2-list assignment on an even cycle; evaluated by #guard (testTight), not stated as a theorem."
    # ------------------------------------------------ Section 4
    - source: "Kirov-Naimi 2016, Lemma 5"
      lean: SimpleGraph.ecc_pendantTower_iff
      module: ListColoring/Core.lean
      status: proved
      note: "A connected graph is n-monophilic iff its core is (also SimpleGraph.ecc_addPendant_iff)."
    - source: "Rubin, in Erdos-Rubin-Taylor 1980, pp. 131-134 (cited in Section 4)"
      lean: ListColoring.rubinTheorem
      module: ListColoring/RubinProof.lean
      status: proved
      note: >-
        A connected graph is 2-choosable iff its core is a vertex, an even cycle or
        theta_{2,2,2m}; both directions, from ListColoring.choosable_two_of_rubinFamily,
        ListColoring.choosable_two_gtheta_iff, ListColoring.not_choosable_two_of_dumbbell,
        ListColoring.rubin_structure, ListColoring.hasCore and ListColoring.choosable_iff_of_coreIs.
        None of the mathematics is ours.
    - source: "Kirov-Naimi 2016, Lemma 6"
      lean: SimpleGraph.ecc_K23
      module: ListColoring/K23.lean
      status: proved
      note: "K_{2,3} is 2-monophilic."
    - source: "Kirov-Naimi 2016, Theorem 2; = Theorem 2(iv) of Chi et al. 2026"
      lean: ListColoring.ecc_two_iff
      module: ListColoring/RubinProof.lean
      status: proved
      note: >-
        Unconditional. The converse needs "not 2-colourable implies an odd cycle", an open TODO in
        Mathlib at the pinned revision, proved here as
        ListColoring.exists_odd_isCycle_of_odd_closed_walk.
    # ------------------------------------------------ Section 5
    - source: "Erdos-Rubin-Taylor 1980; Kirov-Naimi 2016, Section 5"
      lean: SimpleGraph.ERT.col_L₀_eq_zero
      module: ListColoring/NotChoosable.lean
      status: proved
      note: "K_{n,n^n} is n-colourable but not n-choosable (also SimpleGraph.ERT.not_choosable, SimpleGraph.ERT.colorable)."
    - source: "Kirov-Naimi 2016, Lemma 7"
      lean: SimpleGraph.KN5.not_ecc
      module: ListColoring/Section5.lean
      status: "proved for n >= 2 (the paper's n >= 1 is false)"
      note: "See fidelity (1)."
    - source: "Kirov-Naimi 2016, Lemma 8"
      lean: SimpleGraph.KN5.left_disjoint
      module: ListColoring/Section5.lean
      status: "proved in the form used downstream"
      note: "Also SimpleGraph.KN5.left_card_eq. See fidelity (2)."
    - source: "Kirov-Naimi 2016, Lemma 9"
      lean: SimpleGraph.KN5.badColor_unique
      module: ListColoring/Section5.lean
      status: "proved for n >= 2 (the paper's n >= 1 is false)"
      note: "Stated on K_{n,n^n} with an erased colour rather than with an apex vertex; the same statement. See fidelity (1)."
    - source: "Kirov-Naimi 2016, Lemma 10"
      lean: SimpleGraph.KN5.choosable
      module: ListColoring/Section5.lean
      status: "proved for n >= 2 (the paper's n >= 1 is false)"
      note: "See fidelity (1)."
    - source: "Kirov-Naimi 2016, Section 5 theorem"
      lean: SimpleGraph.KN5.exists_choosable_not_ecc_of_two_le
      module: ListColoring/Section5.lean
      status: proved
      note: "For every k >= 2 a graph that is k-choosable but not ECC at k: H_k for k >= 3, theta_{2,2,4} for k = 2."
    # ------------------------------------------------ Section 6
    - source: "Kirov-Naimi 2016, remark under Question 1"
      lean: ListColoring.OpenProblem.not_ecc_two_boxProd_path_two_three
      module: OpenProblems.lean
      status: "stated, asserted with sorry"
      note: "Known (a corollary of Theorem 2), not proved here. Its citation of a nonexistent Theorem 3 is fidelity (4)."
    - source: "Kirov-Naimi 2016, Question 1"
      lean: ListColoring.OpenProblem.question1
      module: OpenProblems.lean
      status: "open, asserted with sorry"
      note: >-
        Is the product of two n-monophilic graphs n-monophilic, for n >= 3? Open. For two paths,
        the ladder, height-three and maximum-degree results below settle it at heights 2 and 3
        for every k >= 3, and for every rectangle at k >= 20.
    - source: "Kirov-Naimi 2016, Question 2; Zhang-Dong, arXiv:2608.19773, Theorem 6"
      lean: ListColoring.OpenProblem.not_question2
      module: OpenProblems.lean
      status: "refuted, proved"
      note: "From ZhangDong.not_persistence and ZhangDong.exists_ecc_not_ecc_succ (NonPersistence/Statements.lean). The mathematics is Zhang and Dong's."
    # ------------------------------------------------ results the paper uses but does not state
    - source: "Whitney 1932; Birkhoff 1912"
      lean: SimpleGraph.eval_chromaticPolynomial
      module: ListColoring/ChromaticPolynomial.lean
      status: proved
      note: "The Whitney subset expansion evaluates to the colouring count; built so that ecc_iff_listColorFunction_eq_eval has a genuine polynomial on the right."
    - source: "definitional; Kostochka-Sidorenko 1990/92 and Kirov-Naimi 2016"
      lean: SimpleGraph.ecc_iff_listColorFunction_eq_eval
      module: ListColoring/ListColorFunction.lean
      status: proved
      note: "ECC at n iff P_l(G,n) = P(G,n)."
    - source: "Donner 1992"
      lean: SimpleGraph.exists_ecc_forall_ge
      module: ListColoring/Threshold.lean
      status: proved
      note: "Every graph is ECC at all large n; the explicit threshold 2^|E(G)| < n is SimpleGraph.ecc_of_two_pow_lt."
    # ------------------------------------------------ beyond the paper (original to this repository)
    - source: "original to this repository (cacti)"
      lean: ListColoring.isCactus_ecc_iff
      module: Cacti/Statements.lean
      status: proved
      note: >-
        A cactus is ECC at every list size iff it has at most one cycle or contains an odd cycle.
        Its cases: ListColoring.isCactus_ecc_two_iff, ListColoring.isCactus_ecc_three,
        ListColoring.isCactus_ecc_of_four_le, ListColoring.isCactus_ecc_of_three_le.
    - source: "original to this repository (ladders; Question 1 at height two)"
      lean: ListColoring.ecc_boxProd_pathG_one
      module: Ladder/Statements.lean
      status: proved
      note: "Every 2 x (n+1) grid is ECC at every k >= 3; the count is ListColoring.colConst_boxProd_pathG_one."
    - source: "original to this repository (Question 1 at height three)"
      lean: ListColoring.ecc_boxProd_pathG_two_of_three
      module: Grid3/Three/Main.lean
      status: proved
      note: >-
        Every 3 x (n+1) grid is ECC at every k >= 3; ListColoring.ecc_boxProd_pathG_two (k >= 5)
        and ListColoring.ecc_boxProd_pathG_two_of_four (k >= 4) are in Grid3/Statements.lean, with
        the count ListColoring.colConst_boxProd_pathG_two.
    - source: "adapts Zhang-Dong arXiv:2609.08540; positivity half credited to Dong-Koh 2008"
      lean: SimpleGraph.eccAt_of_degree_bound
      module: GridGen/MaximumDegree.lean
      status: proved
      note: >-
        Every finite graph is ECC at every k with 567 Delta <= 100 k (also
        SimpleGraph.eccAt_of_maxDegree_bound). Sharper: SimpleGraph.eccAt_of_degree_le_three
        (k >= 15), SimpleGraph.eccAt_of_degree_le_four_twenty (k >= 20) with every rectangle as
        ListColoring.ecc_boxProd_pathG_of_twenty, and Delta <= 5..8 in GridGen/SmallDegree.lean.
        All are instances of GridGen.Polymer.CertifiedAt.
    - source: "adapts Zhang-Dong arXiv:2609.08540, Theorem 5 (strictness at 23.41 Delta)"
      lean: SimpleGraph.col_eq_colConst_iff_constant_of_degree_bound
      module: GridGen/PolymerStability.lean
      status: proved
      note: >-
        On a connected graph at the uniform threshold, equality holds exactly for constant
        assignments; the generic form at every certified threshold is
        GridGen.Polymer.col_eq_colConst_iff_of_certifiedAt.
    - source: "adapts Kaul et al. 2023, Theorem 7(ii) (the case n = 26 they leave open)"
      lean: SimpleGraph.TwoDegenerate.K2_26.not_eccAt_four
      module: TwoDegenerate/Counterexample.lean
      status: proved
      note: "K_{2,26} is not ECC at 4, and is 2-degenerate (SimpleGraph.TwoDegenerate.K2_26.not_every_twoDegenerate_eccAt_four)."
    - source: "Kaul et al. 2023, Theorem 7, with the cases it leaves open"
      lean: SimpleGraph.TwoDegenerate.completeBipartite_two_eccAt_four_iff
      module: TwoDegenerate/K2n/Main.lean
      status: proved
      note: >-
        K_{2,n} is ECC at 3, 4, 5 exactly for n <= 11, 25, 43
        (SimpleGraph.TwoDegenerate.completeBipartite_two_eccAt_three_iff, _four_iff, _five_iff;
        SimpleGraph.TwoDegenerate.K2_11.eccAt_three, K2_25.eccAt_four). The cases n = 11 at 3 and
        n = 25, 26 at 4 are original to this repository. Reduction:
        SimpleGraph.TwoDegenerate.K2n.le_col_of_keyGoals; checker:
        SimpleGraph.TwoDegenerate.K2n.check_sound; negative side:
        SimpleGraph.TwoDegenerate.K2n.col_witness_lt.
    - source: "Kaul et al. arXiv:2202.03431, Conjecture 5 (upper side), open in the literature"
      lean: SimpleGraph.TwoDegenerate.K2nSqrt.completeBipartite_two_eccAt_of_sq_le
      module: TwoDegenerate/K2nSqrt/Main.lean
      status: proved
      note: >-
        K_{2,n} is ECC at every k >= 300 with n <= k^2, so tau(K_{2,n}) <= max(300, floor(sqrt n) + 1)
        (SimpleGraph.TwoDegenerate.K2nSqrt.completeBipartite_two_eccAt_of_sqrt_lt). Original to this
        repository. Class AM-GM: SimpleGraph.TwoDegenerate.K2nSqrt.lowerG_le_sum; analytic
        inequality: SimpleGraph.TwoDegenerate.K2nSqrt.target_le_lowerG; overlap k - 1 is Kaul et
        al. arXiv:2207.04831 Lemma 6 (SimpleGraph.TwoDegenerate.K2nSqrt.lemma6).
