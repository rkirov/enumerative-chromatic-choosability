name: comparator

# Runs the real leanprover/comparator against this repository: statement match between
# comparator/Challenge.lean and the library, the permitted-axiom check, and kernel replay
# via lean4export in a landrun sandbox. The second, independent nanoda kernel that
# lean-eval's harness forces on is deliberately not run: with the k = 3 height-three
# certificate the export is close to 1 GB and each sequential kernel replay takes hours, so
# two replays plus the build exceed GitHub's six-hour job limit (see verify.sh).
#
# This REPLACES the hand-rolled axiom audit that used to live in ci.yml. The comparator
# subsumes it: `permitted_axioms` in comparator/config.json is exactly the old allow-list
# {propext, Quot.sound, Classical.choice}, and on top of that the comparator checks that
# the statements really are the ones claimed and replays the proofs through Lean's kernel
# from the export. An axiom audit only ever checked the third of those.
#
# CI ONLY, deliberately. It clones and builds comparator, lean4export and landrun (Go), and
# the export alone needs about 6 GB of memory; that is far too heavy for the development
# machine, which is also short on disk. Local development uses `lake build` and the cheap
# no-placeholder grep in ci.yml.
# Workflow pattern and tool pins follow github.com/rkirov/jacobian-fable.

# Only changes that can affect the check trigger it: documentation-only pushes do not.
on:
  push:
    branches: [main]
    paths:
      - "**/*.lean"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "comparator/**"
      - "verify.sh"
      - ".github/workflows/comparator.yml"
  pull_request:
    paths:
      - "**/*.lean"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "comparator/**"
      - "verify.sh"
      - ".github/workflows/comparator.yml"
  workflow_dispatch:
  # Weekly full run: every shard regardless of what changed (see the scope step below).
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: comparator-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Comparator (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # The claims run as three parallel shards (comparator/shard.py): the kernel replay is one
    # sequential pass per run, and two kernel-decided certificates dominate it, so each gets a job
    # of its own. Together the shards check exactly what one run over config.json checks.
    strategy:
      fail-fast: false
      matrix:
        shard: [grid3-three, k2n, rest]
    steps:
      - uses: actions/checkout@v4

      # The grid3-three shard replays the k = 3 certificate (about 1 h 50 min). Its claim's import
      # closure is Grid3/ and ListColoring/ (plus Mathlib), so it is run only when one of those,
      # the build configuration, or the comparator setup changed since the previous commit (push)
      # or the base (pull request); manual and the weekly scheduled runs always run it. The other
      # shards take minutes and always run.
      - name: Decide whether this shard must run
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          run=true
          if [ "$SHARD" = grid3-three ] && { [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; } \
             && [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            if files=$(gh api "repos/${{ github.repository }}/compare/$BASE...$HEAD" \
                 --jq '.files | if length >= 300 then "TOO_MANY" else .[].filename end'); then
              if ! echo "$files" | grep -qE '^(TOO_MANY$|Grid3/|Grid3\.lean$|ListColoring/|ListColoring\.lean$|lakefile\.toml$|lake-manifest\.json$|lean-toolchain$|comparator/|verify\.sh$|\.github/workflows/comparator\.yml$)'; then
                run=false
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then
            echo "::notice::grid3-three skipped: nothing in its closure changed between $BASE and $HEAD"
          fi

      # Build the library and fetch the Mathlib olean cache. The comparator workspace
      # path-requires the library and reuses this package tree through the symlink verify.sh
      # creates -- not through `packagesDir`, which must stay inside the workspace so that a
      # registry verifier, which confines the build to the selected project, can build it too.
      - uses: leanprover/lean-action@v1
        if: steps.scope.outputs.run == 'true'
        with:
          use-mathlib-cache: "true"
          test: "false"
          lint: "false"

      # The k = 3 certificate (Grid3/Three/, 554 data modules, ~2.4 CPU-hours) is not a default
      # target, so the lean-action cache above never holds it and verify.sh used to rebuild it on
      # every run (37 min). Its sources almost never change: cache its build outputs on them. If
      # an imported module changed anyway, lake's traces notice and rebuild, so a stale hit is
      # only slow, never wrong.
      - name: Cache Grid3/Three build
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            .lake/build/lib/lean/Grid3/Three
            .lake/build/ir/Grid3/Three
          key: grid3-three-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'Grid3/Three/**') }}

      # comparator + lean4export + landrun are pinned and change rarely; cache their clones
      # and builds. verify.sh namespaces the cache directory by toolchain tag.
      - name: Cache comparator tooling
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/graph-coloring-comparator
          key: comparator-${{ runner.os }}-${{ hashFiles('comparator/lean-toolchain', 'verify.sh') }}

      # landrun is a Go build; ubuntu-latest ships go, but be explicit so a missing
      # toolchain fails here with a clear message rather than deep inside verify.sh.
      - name: Check go is available
        if: steps.scope.outputs.run == 'true'
        run: go version

      - name: Write the shard's config
        if: steps.scope.outputs.run == 'true'
        run: python3 comparator/shard.py ${{ matrix.shard }}

      # On CI there is room for comparator's own pinned toolchain, so use the upstream
      # recipe exactly rather than the disk-saving deviation verify.sh allows locally.
      - name: Run comparator
        if: steps.scope.outputs.run == 'true'
        run: ./verify.sh
        env:
          COMPARATOR_OWN_TOOLCHAIN: "1"
          COMPARATOR_CONFIG: config.${{ matrix.shard }}.json
