name = "graph_coloring"
version = "0.1.0"
keywords = ["math", "graph theory", "list coloring"]
defaultTargets = ["ListColoring", "OpenProblems", "Cacti", "NonPersistence", "Ladder", "Grid3",
  "TwoDegenerate", "GridGen"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"

[[lean_lib]]
name = "ListColoring"

# Kirov–Naimi §6's two open questions, stated and asserted with `sorry`. Kept in a library of
# their own so that `ListColoring/` stays provably free of `sorry` — CI greps that directory —
# and so that no theorem can depend on an unproved statement: the import runs this way only.
[[lean_lib]]
name = "OpenProblems"

# The cactus ECC classification (the 2026-08 AI research collaboration; see
# ai_research_notes/FINAL_CACTI_ECC_HANDOFF.md). Separate from the Kirov-Naimi formalization:
# imports ListColoring, never imported by it. Complete and sorry-free; the five headline
# statements are in Cacti/Statements.lean, three of which -- k >= 3, the k = 2 classification
# and the full spectrum -- are claimed in comparator/config.json.
[[lean_lib]]
name = "Cacti"

# Zhang-Dong 2026 (arXiv:2608.19773): equality between the chromatic polynomial and the list-color
# function does not persist from k to k+1. This refutes Kirov-Naimi section 6 Question 2, which
# `OpenProblems.lean` had carried as open. Imports ListColoring, imported by nothing.
[[lean_lib]]
name = "NonPersistence"

# Ladders P_2 box P_n are k-ECC for every k >= 3 -- the first grid family proved at every list
# size. Source of record: ai_research_notes/GRID_LADDER_ALL_K_2026-08-24.md, which extends the
# k = 3 argument of ladder_three_um_complete_proof.md. Imports ListColoring, imported by nothing.
[[lean_lib]]
name = "Ladder"

# Height-three grids P_3 box P_n are k-ECC for every k >= 4 -- the eigenfunctional telescoping
# of ai_research_notes/GRID_HEIGHT3_EIGENFUNCTIONAL_2026-08-25.md. For k >= 5 its two seam
# inequalities are proved one column back through a pair lemma whose threshold is
# (k-2)(k-3) >= k+1; for k = 4 they need two columns of lookback and the LP certificates of
# Grid3/Four/. Complete and sorry-free; k = 3 is not claimed. Imports ListColoring, imported by
# nothing.
[[lean_lib]]
name = "Grid3"

# A formal counterexample to the proposed uniform theorem for 2-degenerate graphs. K_{2,26} is
# 2-degenerate but is not ECC at list size four. Imports ListColoring, imported by nothing.
# Brute-force `#guard` sweeps that cost minutes of evaluation; not a default target (CI builds it).
[[lean_lib]]
name = "Checks"

[[lean_lib]]
name = "TwoDegenerate"

# GridGen/PolymerCertificate.lean proves ECC (with strictness and the equality case) from a
# rational parity certificate; MaximumDegree.lean (k >= ceil(5.67Δ)), DegreeFourTwenty.lean
# (Δ <= 4, k >= 20, hence every rectangle) and SmallDegree.lean are its instances. This finite
# polymer proof uses no seam enumeration. See GridGen/README.md.
# The separate all-k >= 5 route remains the telescoping and lookback reduction of
# ai_research_notes/GRID_REVIEW_2026-09-02.md section 5.6 for an arbitrary row graph H, so that
# H box P_n is k-ECC once the two-step seam inequality and the initial inequality hold. Both are
# explicit hypotheses (no sorry); the conjecture that they hold for all paths at k >= 5 is a
# Prop. Imports ListColoring, imported by nothing.
[[lean_lib]]
name = "GridGen"
